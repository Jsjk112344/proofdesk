[project]
name = "proofdesk"
version = "0.1.0"
description = "Sandboxed technical demonstrations for evidence-backed outreach"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "ruff>=0.17.3",
]
