# systemd drop-in for public-demo mode: /etc/systemd/system/proofdesk.service.d/public.conf
# NOT installed by default; see docs/public-demo.md. Replace demo.example.invalid with the
# approved hostname. The API still binds to loopback; Caddy terminates TLS in front of it.
# Live model mode stays off unless PROOFDESK_PUBLIC_LIVE=1 is added together with an
# approved plan and the controller credential, which docs/plan.md requires separately.
[Service]
Environment=PROOFDESK_PUBLIC_DEMO=1
Environment=PROOFDESK_ALLOWED_HOSTS=127.0.0.1,localhost,demo.example.invalid
Environment=PROOFDESK_WEB_MAX_PROSPECTS=100
Environment=PROOFDESK_PUBLIC_URL_ALLOWLIST=
ExecStart=
ExecStart=/opt/proofdesk/.venv/bin/python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 --workers 1 --no-access-log --proxy-headers --forwarded-allow-ips 127.0.0.1
